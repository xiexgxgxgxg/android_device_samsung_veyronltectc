# W2017 (SM-W2017): Broadcom BCM4358 combo, stock APJ7 firmware.
# Without this file the vendor lib falls back to the S7 target name
# (BCM43569) and fails to find its firmware patch:
#   E bt_hwcfg: vendor lib preload failed to locate firmware patch file
# which makes the first HCI command time out and aborts bt_hci_thread.
Chipset = BCM4358
UartPort = /dev/ttyHS0
UartForceUse2StopBits = 0
FwPatchFilePath = /vendor/firmware/
FwPatchFileName = bcm4358A1_V0056.0103.hcd
